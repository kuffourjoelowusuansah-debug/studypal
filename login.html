<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyPal · Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body data-p="login">
<div class="bg"><i></i><i></i><i></i></div>
<section id="auth" class="glass auth">
  <h1>StudyPal</h1><p>Your study life, synced on every device.</p>
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <button id="login">Log in</button><button id="signup" class="alt">Create account</button><button id="google" class="alt">Continue with Google</button><button id="skip" class="alt">Skip login for now</button>
  <p id="aerr" class="err"></p>
</section>
<script src="app.js"></script>
</body></html>
