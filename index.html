<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyPal · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body data-p="home">
<div class="bg"><i></i><i></i><i></i></div>
<div id="app">
<button id="menu" class="glass icon">☰</button>
<aside id="side" class="glass"><h2>StudyPal</h2><nav><a href="index.html" class="on">🏠 Dashboard</a><a href="focus.html">⏱️ Focus Hub</a><a href="tasks.html">✅ Tasks</a><a href="flashcards.html">🗂️ Flashcards</a><a href="notes.html">📒 Cheat Sheets</a><a href="quiz.html">🎯 Quizzes</a></nav>
<div class="foot"><button id="theme" class="alt">🌓 Dark / Light</button><button id="out" class="alt">Log out</button></div></aside>
<main>

    <h1>Hello 👋</h1>
    <div class="grid">
      <div class="glass card"><h3>Study streak</h3><div class="big"><span id="streak">0</span> days</div><p class="mut">Finish a focus session or a task to keep it alive.</p></div>
      <div class="glass card"><h3>Pending today</h3><ul id="pend" class="list"></ul></div>
    </div>
    <div class="glass card"><h3>Exam countdowns</h3>
      <form id="examF" class="row"><input id="exN" placeholder="Exam name" required><input id="exD" type="datetime-local" required><button>Add exam</button></form>
      <div id="exams" class="grid"></div></div>
  
</main></div>
<script src="app.js"></script>
</body></html>
